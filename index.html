<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Relics of the Six Temples — Season 2</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #07060a; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game { width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #rotate { display: none; position: fixed; inset: 0; background: #07060aee; color: #ffd56a; font: 700 20px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10; }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your device to landscape for the best experience.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
